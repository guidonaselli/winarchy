[package]
name = "winarchy-assistant"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Memory", "Win32_Media_Audio", "Win32_Globalization",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
