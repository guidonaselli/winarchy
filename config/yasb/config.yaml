# Winarchy — YASB config (estático; los colores viven en styles.css generado por el theme engine)
# NOTA: verificar nombres de widgets contra la wiki de YASB v2.x en el smoke test (tarea 9.1).
watch_stylesheet: true
watch_config: true
# Identidad unificada: YASB no muestra tray propio (el tray del stack lo hostea AHK)
# ni corre su update checker (los updates los maneja `winarchy update`). El widget
# `systray` de la barra (más abajo) NO se ve afectado: sigue mostrando iconos de terceros.
show_systray: false
update_check: false

komorebi:
  start_command: "komorebic start"
  stop_command: "komorebic stop"
  reload_command: "komorebic reload-configuration"

bars:
  status-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      align: "center"
    blur_effect:
      enabled: false
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 34
    # padding = offset del bar window respecto a los bordes de pantalla; 0 = pegada
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left: ["home", "komorebi_workspaces", "komorebi_active_layout", "active_window"]
      center: ["clock"]
      right: ["game_mode", "media", "gpu", "cpu", "memory", "wifi", "bluetooth", "microphone", "volume", "notifications", "systray", "winarchy_menu"]

widgets:
  # Menú de inicio: accesos a Configuración de Windows + system/power menu
  home:
    type: "yasb.home.HomeWidget"
    options:
      label: ""   # logo Windows (nerd font)
      menu_list:
        - { title: "Configuración", uri: "ms-settings:" }
        - { title: "Red e Internet", uri: "ms-settings:network" }
        - { title: "Bluetooth", uri: "ms-settings:bluetooth" }
        - { title: "Pantalla", uri: "ms-settings:display" }
        - { title: "Sonido", uri: "ms-settings:sound" }
      system_menu: true
      power_menu: true
      blur: false

  # Indicador de game-mode manual: muestra GAME si existe state\game-mode.flag.
  # (la suspensión automática por juego la maneja AHK; esto refleja el toggle manual)
  game_mode:
    type: "yasb.custom.CustomWidget"
    options:
      label: "{data}"
      label_alt: "{data}"
      class_name: "game-mode-widget"
      exec_options:
        # OJO: YASB hace run_cmd.split(" ") sin shell — no usar comillas dobles
        # (le llegan literales a PowerShell y evalúa un string en vez del comando)
        run_cmd: "powershell -NoProfile -Command if (Test-Path $env:KOMOREBI_CONFIG_HOME\\..\\..\\state\\game-mode.flag) { 'GAME' } else { '' }"
        run_interval: 3000
        return_format: "string"

  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "komorebi offline"
      label_workspace_btn: "{name}"
      label_default_name: "{index}"
      hide_empty_workspaces: false

  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{icon}"

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "[class_name='{win[class_name]}' exe='{win[process][name]}']"
      label_no_window: ""
      max_length: 56
      max_length_ellipsis: "…"
      monitor_exclusive: true

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M}"
      label_alt: "{%A %d %b %Y · %H:%M:%S}"
      timezones: []

  # Qué está sonando (Spotify, navegador, etc). Click: play/pausa.
  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "<span></span> {title}"
      label_alt: "<span></span> {artist}{s}{title}"
      hide_empty: true
      show_thumbnail: false
      controls_hide: true
      max_field_size:
        label: 24
        label_alt: 44
      callbacks:
        on_left: "toggle_play_pause"
        on_middle: "open_media_source"
        on_right: "toggle_label"

  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      label: "<span>󰢮</span> {info[utilization]}%"
      label_alt: "<span>󰢮</span> {info[mem_used]}/{info[mem_total]}"
      update_interval: 2000

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span></span> {info[percent][total]}%"
      label_alt: "<span></span> {info[histograms][cpu_percent]}"
      update_interval: 2000

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>󰍛</span> {virtual_mem_percent}%"
      label_alt: "<span>󰍛</span> {virtual_mem_free}"
      update_interval: 5000

  # Click: menú de redes wifi de YASB. Click derecho: Configuración de red.
  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span> {wifi_name}"
      # En ethernet muestra este icono (glifo MD; el default codicons se recorta
      # y el FA de ethernet no existe en JetBrainsMono NF)
      ethernet_label: "<span>{wifi_icon}</span>"
      ethernet_label_alt: "<span>{wifi_icon}</span> {ip_addr}"
      ethernet_icon: "󰈀"
      update_interval: 15000
      hide_if_ethernet: false
      callbacks:
        on_left: "toggle_menu"
        on_right: "exec cmd.exe /c start ms-settings:network"

  # Click: Configuración de bluetooth de Windows.
  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {device_name}"
      callbacks:
        on_left: "exec cmd.exe /c start ms-settings:bluetooth"
        on_right: "toggle_label"

  # Click: mute mic. Click derecho: menú de micrófonos.
  microphone:
    type: "yasb.microphone.MicrophoneWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {level}%"
      callbacks:
        on_left: "toggle_mute"
        on_middle: "toggle_label"
        on_right: "toggle_mic_menu"

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "{volume}"

  # Click: centro de notificaciones de Windows. Click derecho: limpiar.
  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span>{icon}</span> {count}"
      label_alt: "{count} notificaciones"
      hide_empty: false
      callbacks:
        on_left: "toggle_notification"
        on_right: "clear_notifications"

  # Solo iconos pinneados a la vista; el resto detrás del botón.
  # Pinnear/despinnear: alt+click sobre el icono.
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      label_collapsed: ""
      label_expanded: ""
      pin_click_modifier: "alt"
      show_unpinned: false
      # Componentes del stack (los instala Winarchy vía versions.lock.toml): su
      # identidad va unificada, sin tray propio, se ocultan del systray de la barra.
      # Solo apps que Winarchy instala van acá (Windhawk/Twinkle Tray/etc. NO: son
      # personales de la máquina, fuera de alcance).
      hide_icons: ["Flow.Launcher", "ShareX"]

  # Esquina derecha, estilo Omarchy: abre el menu principal de winarchy.ahk
  # (Apps/Themes/System/...), el mismo que SUPER+Alt+Space y el right-click del
  # tray. YASB es un proceso separado y no puede llamar funciones de AHK
  # directo: el click toca un flag (mismo patron que game_mode) que AHK levanta
  # con su propio watcher.
  winarchy_menu:
    type: "yasb.custom.CustomWidget"
    options:
      label: "☰"
      class_name: "winarchy-menu-widget"
      callbacks:
        on_left: "exec powershell -NoProfile -Command New-Item -ItemType File -Force -Path $env:KOMOREBI_CONFIG_HOME\\..\\..\\state\\show-menu.flag"
