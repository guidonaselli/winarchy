[package]
name = "winarchy-shell"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
accesskit = "0.25.2"
accesskit_windows = "0.35.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.58"
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
  "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Power", "UI_Notifications", "Media_Control", "UI_Notifications_Management", "Foundation_Collections", "ApplicationModel", "Foundation", "Win32_System_Com", "Win32_System_Performance",
  "Win32_Media", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Networking_NetworkListManager", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_Security_Credentials",
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_RemoteDesktop", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_Debug", "Win32_System_Variant", "Win32_System_Registry", "Win32_Storage_EnhancedStorage", "Win32_UI_WindowsAndMessaging", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell_Common", "Win32_UI_Controls", "implement", "Win32_System_SystemServices", "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
windows = { version = "0.58", features = ["Win32_System_StationsAndDesktops"] }

[profile.release]
# Un hilo caído deja la barra viva pero muda: mejor morir y que el watchdog relance.
panic = "abort"
opt-level = "s"
lto = true
strip = true
