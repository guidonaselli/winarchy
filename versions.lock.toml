# Versiones fijadas de los componentes core de Winarchy.
# `winarchy update` NO actualiza estos componentes; solo `winarchy update --core`
# los actualiza (y reescribe este archivo) tras revisar changelogs.
# Fijado el 2026-06-09. Último repaso de dependencias: 2026-08-16
# (komorebi 0.1.41 y Flow 2.1.3 ya estaban al día; YASB 2.0.2 -> 2.0.6, ShareX 20.2 -> 21.0,
#  starship, zoxide y fastfetch al último. Changelogs de YASB y ShareX sin breaking changes
#  que nos afecten: el widget removido de YASB es AI Chat, que no usamos.)

[core]
komorebi = "0.1.41"
yasb = "2.0.6"
# Flow y AHK también van pinneados: el stack depende de su comportamiento concreto
# (ToggleFlow relanza el exe de Flow; AHK es el dueño único de hotkeys), así que un major
# suyo no debe entrar por `winarchy update` sin que alguien lea el changelog.
flow = "2.1.3"
ahk = "2.0.26"
# WezTerm es el terminal por defecto: su config la genera Winarchy entera, así que un
# cambio de su API de config no debe entrar por `winarchy update`. Ojo con el pin: la
# última release estable de WezTerm es de 2024-02-03 y upstream solo publica nightlies
# desde entonces (verificado 2026-09-06), así que `update --core` no va a moverlo
# mientras no vuelvan a taggear. No es un pin olvidado.
wezterm = "20240203-110809-5046fc22"

# Reglas por aplicacion de la comunidad de komorebi (vendorizado en vendor/asc/).
# Se compila DENTRO del komorebi.json generado; no se usa app_specific_configuration_path
# (Winarchy define la precedencia, no komorebi). Viaja con el release: lo refresca
# `winarchy rules sync`, que muestra el diff y no pisa config/komorebi/rules.toml.
[asc]
repo = "LGUG2Z/komorebi-application-specific-configuration"
commit = "e647fc15970964777dedbb4ba79d5e8547d722fb"
date = "2026-07-16"
sha256 = "c4680fda08b7e188017ceabed65d2d7252e6a0c0a3e0933a00aa54638a3e4f50"

[winget]
# id de winget -> requerido (true = lo instala install.ps1)
"LGUG2Z.komorebi" = true
"AmN.yasb" = true
"AutoHotkey.AutoHotkey" = true
"Flow-Launcher.Flow-Launcher" = true
"ShareX.ShareX" = true
"wez.wezterm" = true
# Windows Terminal se conserva: Winarchy no lo abre, pero le sigue aplicando el scheme.
"Microsoft.WindowsTerminal" = true
"DEVCOM.JetBrainsMonoNerdFont" = true
# Herramientas del terminal profile (no core, sin pin: siguen su último release).
# Algunas pueden venir de scoop en vez de winget; en ese caso las actualiza el paso de
# scoop de `winarchy update`, y quien verifica que estén es `doctor`, que las busca por
# comando y no por gestor.
"Starship.Starship" = true
"junegunn.fzf" = true
"ajeetdsouza.zoxide" = true
"eza-community.eza" = true
"sharkdp.bat" = true
"Fastfetch-cli.Fastfetch" = true

[scoop]
# Las mismas herramientas pueden venir de scoop en vez de winget. Se declaran por nombre
# de app de scoop para que `winarchy update` actualice SOLO estas y no todo lo que tengas
# instalado con scoop, que no es asunto de Winarchy.
starship = true
fzf = true
zoxide = true
eza = true
bat = true
fastfetch = true
"JetBrainsMono-NF" = true
