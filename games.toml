# Juegos conocidos por Winarchy.
# Cada entrada genera: (a) ignore-rule en komorebi (nunca se tilean),
# (b) suspensión de hotkeys SUPER cuando el proceso está en primer plano,
# (c) exclusión en PowerToys Quick Accent (solo si está instalado).
# Alta rápida: `winarchy game-mode add <exe>` / baja: `winarchy game-mode remove <exe>`.
# `exe` es el nombre del proceso sin ruta (con o sin .exe).
#
# Los [[games]] de abajo son defaults curados de varias generaciones. Si un .exe
# no coincide con ningún proceso, simplemente no hace nada (no rompe). Se evitan
# nombres genéricos (javaw.exe, hl2.exe, ShooterGame.exe) que matchearían apps no-juego.

# --- Lanzadores y ventanas no-juego que tampoco deben tilearse ----------------
[[launchers]]
exe = "steam.exe"

[[launchers]]
exe = "steamwebhelper.exe"

[[launchers]]
exe = "EpicGamesLauncher.exe"

[[launchers]]
exe = "GalaxyClient.exe"

[[launchers]]
exe = "Riot Client.exe"

[[launchers]]
exe = "Battle.net.exe"

[[launchers]]
exe = "EADesktop.exe"

[[launchers]]
exe = "upc.exe"                       # Ubisoft Connect

[[launchers]]
exe = "rustdesk.exe"                  # escritorio remoto: la sesión no debe tilearse

