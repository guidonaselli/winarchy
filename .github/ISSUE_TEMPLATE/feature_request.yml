name: Feature request
description: Something Winarchy should do that it doesn't.
labels: ["type: feature", "status: needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The workflow or problem, not only the solution. "I switch monitors a lot and ..." helps more than "add a hotkey for X".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. If Omarchy or another tool already does it, a link helps.
  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: Workarounds you use now, if any (user.ahk, rules.toml, a script).
