name: ci

on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Syntax + tests
        shell: pwsh
        run: .\tests\Invoke-WinarchyChecks.ps1

  shell:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v7

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: winarchy-shell
          path: shell/target/release/winarchy-shell.exe

  assistant:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v7

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: winarchy-assistant
          path: assistant/target/release/winarchy-assistant.exe
