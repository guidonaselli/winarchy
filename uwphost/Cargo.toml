[package]
name = "winarchy-uwphost"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
object = { version = "0.36.7", default-features = false, features = ["read", "std"] }
pdb = "0.8.0"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
