[package]
name = "winarchy-files"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-reactor = "=0.100.0"

[target.'cfg(windows)'.dependencies]
windows-collections = "=0.3.2"
windows = { version = "=0.62.2", features = [
    "ApplicationModel_DataTransfer", "Data_Pdf", "Foundation", "Storage", "Storage_Streams",
    "Win32_Foundation", "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory",
    "Win32_System_Threading", "Win32_System_Time",
    "Win32_UI_Accessibility", "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
