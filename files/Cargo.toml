[package]
name = "winarchy-files"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-reactor = "=0.100.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell"] }
