      --icon-accent: currentColor;
      --icon-back-opacity: 0.38;
      --icon-accent-opacity: 0.14;
      --icon-stroke-width: 3.25;
    }
    .back {
      stroke: var(--icon-stroke, currentColor);
      stroke-opacity: var(--icon-back-opacity, 0.38);
    }
    .front {
      stroke: var(--icon-stroke, currentColor);
    }
    .accent {
      fill: var(--icon-accent, currentColor);
      fill-opacity: var(--icon-accent-opacity, 0.14);
    }
    .dash {
